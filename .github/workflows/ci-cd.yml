name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  APP_PORT: 8080

jobs:
  build-and-test:
    name: Build images and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build stack and wait for health
        run: docker compose up -d --build --wait

      - name: Smoke test API through nginx
        run: |
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/api/notes
          curl -fsS -X POST http://localhost:8080/api/notes \
            -H "Content-Type: application/json" \
            -d '{"title":"ci-note","content":"from github actions","tags":["ci"]}'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Push images to GHCR
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.names.outputs.owner }}
      tag: ${{ steps.names.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image names
        id: names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/${OWNER}/notes-management-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${OWNER}/notes-management-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.names.outputs.backend }}:${{ github.sha }}
            ${{ steps.names.outputs.backend }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.names.outputs.frontend }}:${{ github.sha }}
            ${{ steps.names.outputs.frontend }}:latest

  deploy-ec2:
    name: Deploy to EC2
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TO_EC2 == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            cd /opt/notes-management
            git fetch origin main
            git reset --hard origin/main

            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            cat > .env <<EOF
            APP_PORT=80
            TAG=${GITHUB_SHA}
            BACKEND_IMAGE=ghcr.io/${OWNER}/notes-management-backend
            FRONTEND_IMAGE=ghcr.io/${OWNER}/notes-management-frontend
            EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
